<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B7189"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="#FFFFFF"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#12263A">KidBase — C4 Level 1: System Context</text>
  <text x="40" y="70" font-size="13" fill="#5B7189">Who uses KidBase and which external systems it depends on</text>
  <line x1="40" y1="86" x2="1160" y2="86" stroke="#DCE5EE" stroke-width="1"/>

  <g>
    <rect x="50" y="130" width="200" height="86" rx="10" fill="#2D6CB2" stroke="#1E4F87" stroke-width="1.5"/>
    <text x="150" y="166" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Admin / Owner</text>
    <text x="150" y="186" font-size="11" fill="#CFE1F5" text-anchor="middle">[Person]</text>
    <text x="150" y="203" font-size="11" fill="#CFE1F5" text-anchor="middle">Runs the daycare</text>
  </g>

  <g>
    <rect x="50" y="257" width="200" height="86" rx="10" fill="#2D6CB2" stroke="#1E4F87" stroke-width="1.5"/>
    <text x="150" y="293" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Staff</text>
    <text x="150" y="313" font-size="11" fill="#CFE1F5" text-anchor="middle">[Person]</text>
    <text x="150" y="330" font-size="11" fill="#CFE1F5" text-anchor="middle">Teachers &amp; assistants</text>
  </g>

  <g>
    <rect x="50" y="384" width="200" height="86" rx="10" fill="#2D6CB2" stroke="#1E4F87" stroke-width="1.5"/>
    <text x="150" y="420" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Parent / Guardian</text>
    <text x="150" y="440" font-size="11" fill="#CFE1F5" text-anchor="middle">[Person]</text>
    <text x="150" y="457" font-size="11" fill="#CFE1F5" text-anchor="middle">Receives updates</text>
  </g>

  <rect x="480" y="210" width="250" height="190" rx="12" fill="#12263A" stroke="#0A1826" stroke-width="2"/>
  <text x="605" y="266" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">KidBase</text>
  <text x="605" y="292" font-size="11" fill="#8FA8C0" text-anchor="middle">[Software System]</text>
  <line x1="516" y1="308" x2="694" y2="308" stroke="#2D4359" stroke-width="1"/>
  <text x="605" y="330" font-size="12" fill="#C7D6E4" text-anchor="middle">Preschool &amp; daycare</text>
  <text x="605" y="348" font-size="12" fill="#C7D6E4" text-anchor="middle">management system</text>
  <text x="605" y="374" font-size="11" fill="#8FA8C0" text-anchor="middle">Enrollment · Attendance</text>
  <text x="605" y="389" font-size="11" fill="#8FA8C0" text-anchor="middle">Documents · Notifications</text>

  <g>
    <rect x="920" y="170" width="230" height="100" rx="10" fill="#6B7F95" stroke="#54687C" stroke-width="1.5"/>
    <text x="1035" y="202" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Notification Delivery</text>
    <text x="1035" y="221" font-size="11" fill="#DDE6EE" text-anchor="middle">[External System]</text>
    <text x="1035" y="241" font-size="10.5" fill="#C6D4E0" text-anchor="middle">Phase 1: local / dev email</text>
    <text x="1035" y="257" font-size="10.5" fill="#C6D4E0" text-anchor="middle">Phase 3: managed email / SMS</text>
  </g>

  <g>
    <rect x="920" y="350" width="230" height="100" rx="10" fill="#6B7F95" stroke="#54687C" stroke-width="1.5"/>
    <text x="1035" y="382" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Document Storage</text>
    <text x="1035" y="401" font-size="11" fill="#DDE6EE" text-anchor="middle">[External System]</text>
    <text x="1035" y="421" font-size="10.5" fill="#C6D4E0" text-anchor="middle">Phase 1: local filesystem</text>
    <text x="1035" y="437" font-size="10.5" fill="#C6D4E0" text-anchor="middle">Phase 3: AWS S3</text>
  </g>

  <path d="M 250 173 L 360 173 L 360 250 L 480 250" fill="none" stroke="#5B7189" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="266" y="148" font-size="11" fill="#5B7189">Manages enrollment, staff,</text>
  <text x="266" y="163" font-size="11" fill="#5B7189">records, and operations</text>

  <path d="M 250 300 L 480 300" fill="none" stroke="#5B7189" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="266" y="278" font-size="11" fill="#5B7189">Manages daily attendance</text>
  <text x="266" y="293" font-size="11" fill="#5B7189">and child operations</text>

  <path d="M 250 427 L 360 427 L 360 360 L 480 360" fill="none" stroke="#5B7189" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="266" y="448" font-size="11" fill="#5B7189">Views child information and</text>
  <text x="266" y="463" font-size="11" fill="#5B7189">receives notifications</text>

  <path d="M 730 260 L 825 260 L 825 220 L 920 220" fill="none" stroke="#5B7189" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="742" y="252" font-size="11" fill="#5B7189">Sends alerts</text>

  <path d="M 730 350 L 825 350 L 825 400 L 920 400" fill="none" stroke="#5B7189" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="742" y="370" font-size="11" fill="#5B7189">Stores / retrieves files</text>

  <line x1="40" y1="545" x2="1160" y2="545" stroke="#DCE5EE" stroke-width="1"/>
  <rect x="40" y="565" width="18" height="18" rx="4" fill="#2D6CB2"/>
  <text x="66" y="579" font-size="12" fill="#3D5266">Person</text>
  <rect x="150" y="565" width="18" height="18" rx="4" fill="#12263A"/>
  <text x="176" y="579" font-size="12" fill="#3D5266">System in scope</text>
  <rect x="320" y="565" width="18" height="18" rx="4" fill="#6B7F95"/>
  <text x="346" y="579" font-size="12" fill="#3D5266">External system</text>
  <text x="40" y="614" font-size="11" fill="#8494A6">External dependencies are named by responsibility, not by vendor, so the diagram stays accurate across all build phases (see ADR-010).</text>
</svg>
