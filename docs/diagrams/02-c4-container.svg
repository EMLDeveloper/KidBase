<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 860" width="1080" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B7189"/>
    </marker>
  </defs>

  <rect width="1080" height="860" fill="#FFFFFF"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#12263A">KidBase — C4 Level 2: Containers</text>
  <text x="40" y="70" font-size="13" fill="#5B7189">Modular monolith: one Spring Boot application, feature-based modules, one relational database</text>
  <line x1="40" y1="86" x2="1040" y2="86" stroke="#DCE5EE" stroke-width="1"/>

  <rect x="410" y="115" width="240" height="62" rx="10" fill="#2D6CB2" stroke="#1E4F87" stroke-width="1.5"/>
  <text x="530" y="145" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Admin · Staff · Parent</text>
  <text x="530" y="164" font-size="11" fill="#CFE1F5" text-anchor="middle">[Person]</text>

  <path d="M 530 177 L 530 217" fill="none" stroke="#5B7189" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="545" y="202" font-size="11" fill="#5B7189">Uses · HTTPS</text>

  <rect x="380" y="217" width="300" height="76" rx="10" fill="#3E7FC1" stroke="#2B639B" stroke-width="1.5"/>
  <text x="530" y="248" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">React Frontend</text>
  <text x="530" y="268" font-size="11" fill="#D6E6F7" text-anchor="middle">[Container: JavaScript / React]</text>
  <text x="530" y="285" font-size="11" fill="#D6E6F7" text-anchor="middle">Web UI for all three roles</text>

  <path d="M 530 293 L 530 333" fill="none" stroke="#5B7189" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="545" y="318" font-size="11" fill="#5B7189">REST / JSON · JWT Bearer</text>

  <rect x="210" y="333" width="640" height="252" rx="12" fill="#12263A" stroke="#0A1826" stroke-width="2"/>
  <text x="530" y="367" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Spring Boot Backend</text>
  <text x="530" y="387" font-size="11" fill="#8FA8C0" text-anchor="middle">[Container: Java / Spring Boot · Modular Monolith]</text>
  <line x1="240" y1="402" x2="820" y2="402" stroke="#2D4359" stroke-width="1"/>

  <g font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <rect x="243" y="420" width="132" height="44" rx="7" fill="#1F3A57" stroke="#2F5379"/>
    <text x="309" y="447">auth</text>
    <rect x="391" y="420" width="132" height="44" rx="7" fill="#1F3A57" stroke="#2F5379"/>
    <text x="457" y="447">child</text>
    <rect x="539" y="420" width="132" height="44" rx="7" fill="#1F3A57" stroke="#2F5379"/>
    <text x="605" y="447">guardian</text>
    <rect x="687" y="420" width="132" height="44" rx="7" fill="#1F3A57" stroke="#2F5379"/>
    <text x="753" y="447">staff</text>

    <rect x="243" y="478" width="132" height="44" rx="7" fill="#1F3A57" stroke="#2F5379"/>
    <text x="309" y="505">enrollment</text>
    <rect x="391" y="478" width="132" height="44" rx="7" fill="#1F3A57" stroke="#2F5379"/>
    <text x="457" y="505">attendance</text>
    <rect x="539" y="478" width="132" height="44" rx="7" fill="#1F3A57" stroke="#2F5379"/>
    <text x="605" y="505">document</text>
    <rect x="687" y="478" width="132" height="44" rx="7" fill="#1F3A57" stroke="#2F5379"/>
    <text x="753" y="505">notification</text>
  </g>
  <text x="530" y="552" font-size="11" fill="#8FA8C0" text-anchor="middle">Each module: Controller → Service → Repository → Entity</text>
  <text x="530" y="570" font-size="11" fill="#8FA8C0" text-anchor="middle">Shared: config · exception · security</text>

  <rect x="70" y="680" width="250" height="100" rx="10" fill="#3C6E5B" stroke="#2C5344" stroke-width="1.5"/>
  <text x="195" y="712" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">PostgreSQL</text>
  <text x="195" y="731" font-size="11" fill="#D2E6DD" text-anchor="middle">[Container: Database]</text>
  <text x="195" y="751" font-size="10.5" fill="#BDDACF" text-anchor="middle">All relational business data</text>
  <text x="195" y="767" font-size="10.5" fill="#BDDACF" text-anchor="middle">Owned solely by the backend</text>

  <rect x="415" y="680" width="250" height="100" rx="10" fill="#6B7F95" stroke="#54687C" stroke-width="1.5"/>
  <text x="540" y="712" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Document Storage</text>
  <text x="540" y="731" font-size="11" fill="#DDE6EE" text-anchor="middle">[External System]</text>
  <text x="540" y="751" font-size="10.5" fill="#C6D4E0" text-anchor="middle">Phase 1: local filesystem</text>
  <text x="540" y="767" font-size="10.5" fill="#C6D4E0" text-anchor="middle">Phase 3: AWS S3</text>

  <rect x="760" y="680" width="250" height="100" rx="10" fill="#6B7F95" stroke="#54687C" stroke-width="1.5"/>
  <text x="885" y="712" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Notification Delivery</text>
  <text x="885" y="731" font-size="11" fill="#DDE6EE" text-anchor="middle">[External System]</text>
  <text x="885" y="751" font-size="10.5" fill="#C6D4E0" text-anchor="middle">Phase 1: local / dev email</text>
  <text x="885" y="767" font-size="10.5" fill="#C6D4E0" text-anchor="middle">Phase 3: managed email / SMS</text>

  <path d="M 380 585 L 380 640 L 195 640 L 195 680" fill="none" stroke="#5B7189" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="192" y="632" font-size="11" fill="#5B7189" text-anchor="middle">JDBC · Spring Data JPA</text>

  <path d="M 530 585 L 530 680" fill="none" stroke="#5B7189" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="545" y="632" font-size="11" fill="#5B7189">Upload / download</text>

  <path d="M 680 585 L 680 640 L 885 640 L 885 680" fill="none" stroke="#5B7189" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="889" y="632" font-size="11" fill="#5B7189" text-anchor="middle">Sends check-in / check-out alerts</text>

  <line x1="40" y1="808" x2="1040" y2="808" stroke="#DCE5EE" stroke-width="1"/>
  <rect x="40" y="822" width="18" height="18" rx="4" fill="#2D6CB2"/>
  <text x="66" y="836" font-size="12" fill="#3D5266">Person</text>
  <rect x="130" y="822" width="18" height="18" rx="4" fill="#3E7FC1"/>
  <text x="156" y="836" font-size="12" fill="#3D5266">Application container</text>
  <rect x="320" y="822" width="18" height="18" rx="4" fill="#12263A"/>
  <text x="346" y="836" font-size="12" fill="#3D5266">Backend (modular monolith)</text>
  <rect x="550" y="822" width="18" height="18" rx="4" fill="#3C6E5B"/>
  <text x="576" y="836" font-size="12" fill="#3D5266">Database</text>
  <rect x="680" y="822" width="18" height="18" rx="4" fill="#6B7F95"/>
  <text x="706" y="836" font-size="12" fill="#3D5266">External system</text>
</svg>
