<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B7189"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#FFFFFF"/>

  <text x="50" y="52" font-size="26" font-weight="700" fill="#12263A">KidBase — Conceptual Data Model</text>
  <text x="50" y="78" font-size="13" fill="#5B7189">The domain in ten seconds. Full columns, keys and constraints are in the detailed ERD.</text>
  <line x1="50" y1="96" x2="1150" y2="96" stroke="#DCE5EE" stroke-width="1"/>

  <!-- identity side -->
  <rect x="90" y="130" width="200" height="64" rx="10" fill="#12263A" stroke="#0A1826" stroke-width="1.5"/>
  <text x="190" y="160" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">User</text>
  <text x="190" y="180" font-size="10.5" fill="#8FA8C0" text-anchor="middle">login · role · account state</text>

  <rect x="60" y="278" width="190" height="64" rx="10" fill="#FFFFFF" stroke="#3C6E5B" stroke-width="1.8"/>
  <text x="155" y="308" font-size="16" font-weight="700" fill="#12263A" text-anchor="middle">Staff</text>
  <text x="155" y="327" font-size="10.5" fill="#7C8DA0" text-anchor="middle">employment profile</text>

  <rect x="300" y="278" width="190" height="64" rx="10" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="1.8"/>
  <text x="395" y="308" font-size="16" font-weight="700" fill="#12263A" text-anchor="middle">Guardian</text>
  <text x="395" y="327" font-size="10.5" fill="#7C8DA0" text-anchor="middle">parent / legal guardian</text>

  <rect x="60" y="430" width="190" height="64" rx="10" fill="#FFFFFF" stroke="#3C6E5B" stroke-width="1.8"/>
  <text x="155" y="460" font-size="15" font-weight="700" fill="#12263A" text-anchor="middle">StaffAttendance</text>
  <text x="155" y="479" font-size="10.5" fill="#7C8DA0" text-anchor="middle">clock in / clock out</text>

  <!-- child -->
  <rect x="600" y="270" width="190" height="80" rx="10" fill="#2D6CB2" stroke="#1E4F87" stroke-width="1.8"/>
  <text x="695" y="304" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Child</text>
  <text x="695" y="325" font-size="10.5" fill="#CFE1F5" text-anchor="middle">the centre of the domain</text>

  <!-- child-owned records -->
  <rect x="900" y="130" width="220" height="58" rx="10" fill="#FFFFFF" stroke="#2D6CB2" stroke-width="1.8"/>
  <text x="1010" y="155" font-size="15" font-weight="700" fill="#12263A" text-anchor="middle">Enrollment</text>
  <text x="1010" y="173" font-size="10.5" fill="#7C8DA0" text-anchor="middle">one period per stay · holds status</text>

  <rect x="900" y="222" width="220" height="58" rx="10" fill="#FFFFFF" stroke="#2D6CB2" stroke-width="1.8"/>
  <text x="1010" y="247" font-size="15" font-weight="700" fill="#12263A" text-anchor="middle">ChildAttendance</text>
  <text x="1010" y="265" font-size="10.5" fill="#7C8DA0" text-anchor="middle">check in / check out</text>

  <rect x="900" y="314" width="220" height="58" rx="10" fill="#FFFFFF" stroke="#2D6CB2" stroke-width="1.8"/>
  <text x="1010" y="339" font-size="15" font-weight="700" fill="#12263A" text-anchor="middle">Document</text>
  <text x="1010" y="357" font-size="10.5" fill="#7C8DA0" text-anchor="middle">forms · records · contracts</text>

  <rect x="900" y="406" width="220" height="58" rx="10" fill="#FFFFFF" stroke="#2D6CB2" stroke-width="1.8"/>
  <text x="1010" y="431" font-size="15" font-weight="700" fill="#12263A" text-anchor="middle">Notification</text>
  <text x="1010" y="449" font-size="10.5" fill="#7C8DA0" text-anchor="middle">sent to a guardian</text>

  <!-- relations -->
  <path d="M 155 194 L 155 278" fill="none" stroke="#5B7189" stroke-width="1.6" marker-end="url(#ca)"/>
  <text x="165" y="242" font-size="11" fill="#5B7189">0..1</text>

  <path d="M 250 162 L 395 162 L 395 278" fill="none" stroke="#5B7189" stroke-width="1.6" marker-end="url(#ca)"/>
  <text x="405" y="242" font-size="11" fill="#5B7189">0..1</text>

  <path d="M 155 342 L 155 430" fill="none" stroke="#5B7189" stroke-width="1.6" marker-end="url(#ca)"/>
  <text x="165" y="392" font-size="11" fill="#5B7189">1 : *</text>

  <path d="M 490 310 L 600 310" fill="none" stroke="#5B7189" stroke-width="1.6"/>
  <text x="545" y="300" font-size="12" font-weight="700" fill="#5B7189" text-anchor="middle">*  ↔  *</text>
  <text x="545" y="330" font-size="10" fill="#8494A6" text-anchor="middle">via child_guardians</text>

  <path d="M 790 292 L 845 292 L 845 159 L 900 159" fill="none" stroke="#5B7189" stroke-width="1.6" marker-end="url(#ca)"/>
  <path d="M 790 300 L 855 300 L 855 251 L 900 251" fill="none" stroke="#5B7189" stroke-width="1.6" marker-end="url(#ca)"/>
  <path d="M 790 320 L 855 320 L 855 343 L 900 343" fill="none" stroke="#5B7189" stroke-width="1.6" marker-end="url(#ca)"/>
  <path d="M 790 328 L 845 328 L 845 435 L 900 435" fill="none" stroke="#5B7189" stroke-width="1.6" marker-end="url(#ca)"/>
  <text x="812" y="212" font-size="11" fill="#5B7189">1 : *</text>
  <text x="812" y="400" font-size="11" fill="#5B7189">1 : *</text>

  <line x1="50" y1="540" x2="1150" y2="540" stroke="#DCE5EE" stroke-width="1"/>
  <text x="50" y="566" font-size="11.5" fill="#7C8DA0">A User is the login account; Staff and Guardian are the domain profiles attached to it. A Guardian can exist before ever receiving a login.</text>
  <text x="50" y="586" font-size="11.5" fill="#7C8DA0">A Child's current enrollment state lives on Enrollment, not on Child, so there is exactly one source of truth.</text>
  <text x="50" y="606" font-size="11.5" fill="#7C8DA0">Records are deactivated by status, never deleted (see ADR-006).</text>
</svg>
