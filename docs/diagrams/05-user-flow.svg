<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C8DA0"/></marker><marker id="fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A08050"/></marker></defs>
<rect width="1600" height="760" fill="#FFFFFF"/>
<text x="50" y="52" font-size="26" font-weight="700" fill="#12263A">KidBase — User Flows</text>
<text x="50" y="78" font-size="13" fill="#5B7189">What each role actually does, step by step, in the MVP</text>
<line x1="50" y1="96" x2="1550" y2="96" stroke="#DCE5EE" stroke-width="1"/>
<rect x="50" y="98" width="1500" height="118" rx="10" fill="#E8F1FA"/>
<rect x="50" y="98" width="6" height="118" rx="3" fill="#2D6CB2"/>
<text x="72" y="150" font-size="15" font-weight="700" fill="#2D6CB2">Admin / Owner</text>
<text x="72" y="170" font-size="11" fill="#7C8DA0">6 steps</text>
<rect x="250" y="120" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#2D6CB2" stroke-width="1.6"/>
<circle cx="274" cy="157" r="13" fill="#2D6CB2"/>
<text x="274" y="162" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="296" y="162" font-size="13" font-weight="600" fill="#12263A">Log in</text>
<path d="M 444 157 L 466 157" fill="none" stroke="#7C8DA0" stroke-width="1.8" marker-end="url(#fa)"/>
<rect x="472" y="120" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#2D6CB2" stroke-width="1.6"/>
<circle cx="496" cy="157" r="13" fill="#2D6CB2"/>
<text x="496" y="162" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="518" y="162" font-size="13" font-weight="600" fill="#12263A">Dashboard</text>
<path d="M 666 157 L 688 157" fill="none" stroke="#7C8DA0" stroke-width="1.8" marker-end="url(#fa)"/>
<rect x="694" y="120" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#2D6CB2" stroke-width="1.6"/>
<circle cx="718" cy="157" r="13" fill="#2D6CB2"/>
<text x="718" y="162" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="740" y="162" font-size="13" font-weight="600" fill="#12263A">Enroll child</text>
<path d="M 888 157 L 910 157" fill="none" stroke="#7C8DA0" stroke-width="1.8" marker-end="url(#fa)"/>
<rect x="916" y="120" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#2D6CB2" stroke-width="1.6"/>
<circle cx="940" cy="157" r="13" fill="#2D6CB2"/>
<text x="940" y="162" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="962" y="162" font-size="13" font-weight="600" fill="#12263A">Upload documents</text>
<path d="M 1110 157 L 1132 157" fill="none" stroke="#7C8DA0" stroke-width="1.8" marker-end="url(#fa)"/>
<rect x="1138" y="120" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#2D6CB2" stroke-width="1.6"/>
<circle cx="1162" cy="157" r="13" fill="#2D6CB2"/>
<text x="1162" y="162" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1184" y="162" font-size="13" font-weight="600" fill="#12263A">Manage staff</text>
<path d="M 1332 157 L 1354 157" fill="none" stroke="#7C8DA0" stroke-width="1.8" marker-end="url(#fa)"/>
<rect x="1360" y="120" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#2D6CB2" stroke-width="1.6"/>
<circle cx="1384" cy="157" r="13" fill="#2D6CB2"/>
<text x="1384" y="162" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="1406" y="162" font-size="13" font-weight="600" fill="#12263A">Review attendance</text>
<rect x="50" y="268" width="1500" height="118" rx="10" fill="#E9F2EE"/>
<rect x="50" y="268" width="6" height="118" rx="3" fill="#3C6E5B"/>
<text x="72" y="320" font-size="15" font-weight="700" fill="#3C6E5B">Staff</text>
<text x="72" y="340" font-size="11" fill="#7C8DA0">6 steps</text>
<rect x="250" y="290" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#3C6E5B" stroke-width="1.6"/>
<circle cx="274" cy="327" r="13" fill="#3C6E5B"/>
<text x="274" y="332" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="296" y="332" font-size="13" font-weight="600" fill="#12263A">Log in</text>
<path d="M 444 327 L 466 327" fill="none" stroke="#7C8DA0" stroke-width="1.8" marker-end="url(#fa)"/>
<rect x="472" y="290" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#3C6E5B" stroke-width="1.6"/>
<circle cx="496" cy="327" r="13" fill="#3C6E5B"/>
<text x="496" y="332" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="518" y="332" font-size="13" font-weight="600" fill="#12263A">Clock in</text>
<path d="M 666 327 L 688 327" fill="none" stroke="#7C8DA0" stroke-width="1.8" marker-end="url(#fa)"/>
<rect x="694" y="290" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#3C6E5B" stroke-width="1.6"/>
<circle cx="718" cy="327" r="13" fill="#3C6E5B"/>
<text x="718" y="332" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="740" y="332" font-size="13" font-weight="600" fill="#12263A">Check in child</text>
<path d="M 888 327 L 910 327" fill="none" stroke="#7C8DA0" stroke-width="1.8" marker-end="url(#fa)"/>
<rect x="916" y="290" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#3C6E5B" stroke-width="1.6"/>
<circle cx="940" cy="327" r="13" fill="#3C6E5B"/>
<text x="940" y="332" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="962" y="332" font-size="13" font-weight="600" fill="#12263A">Add notes</text>
<path d="M 1110 327 L 1132 327" fill="none" stroke="#7C8DA0" stroke-width="1.8" marker-end="url(#fa)"/>
<rect x="1138" y="290" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#3C6E5B" stroke-width="1.6"/>
<circle cx="1162" cy="327" r="13" fill="#3C6E5B"/>
<text x="1162" y="332" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1184" y="332" font-size="13" font-weight="600" fill="#12263A">Check out child</text>
<path d="M 1332 327 L 1354 327" fill="none" stroke="#7C8DA0" stroke-width="1.8" marker-end="url(#fa)"/>
<rect x="1360" y="290" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#3C6E5B" stroke-width="1.6"/>
<circle cx="1384" cy="327" r="13" fill="#3C6E5B"/>
<text x="1384" y="332" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="1406" y="332" font-size="13" font-weight="600" fill="#12263A">Clock out</text>
<rect x="50" y="438" width="1500" height="176" rx="10" fill="#F7EFE6"/>
<rect x="50" y="438" width="6" height="176" rx="3" fill="#8A5A2B"/>
<text x="72" y="560" font-size="15" font-weight="700" fill="#8A5A2B">Parent / Guardian</text>
<text x="72" y="580" font-size="11" fill="#7C8DA0">4 steps</text>
<rect x="250" y="530" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="1.6"/>
<circle cx="274" cy="567" r="13" fill="#8A5A2B"/>
<text x="274" y="572" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="296" y="572" font-size="13" font-weight="600" fill="#12263A">Log in</text>
<path d="M 444 567 L 466 567" fill="none" stroke="#7C8DA0" stroke-width="1.8" marker-end="url(#fa)"/>
<rect x="472" y="530" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="1.6"/>
<circle cx="496" cy="567" r="13" fill="#8A5A2B"/>
<text x="496" y="572" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="518" y="572" font-size="11.5" font-weight="600" fill="#12263A">View child profile</text>
<path d="M 666 567 L 688 567" fill="none" stroke="#7C8DA0" stroke-width="1.8" marker-end="url(#fa)"/>
<rect x="694" y="530" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="1.6"/>
<circle cx="718" cy="567" r="13" fill="#8A5A2B"/>
<text x="718" y="572" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="740" y="572" font-size="13" font-weight="600" fill="#12263A">View attendance</text>
<path d="M 888 567 L 910 567" fill="none" stroke="#7C8DA0" stroke-width="1.8" marker-end="url(#fa)"/>
<rect x="916" y="530" width="190" height="74" rx="9" fill="#FFFFFF" stroke="#8A5A2B" stroke-width="1.6"/>
<circle cx="940" cy="567" r="13" fill="#8A5A2B"/>
<text x="940" y="572" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="962" y="572" font-size="13" font-weight="600" fill="#12263A">View documents</text>
<rect x="250" y="452" width="470" height="46" rx="9" fill="#FFFFFF" stroke="#A08050" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="268" y="473" font-size="12" font-weight="700" fill="#8A5A2B">Alternate entry — opens a check-in / check-out notification</text>
<text x="268" y="489" font-size="10.5" fill="#9A7E5A">Parents may also open KidBase directly; the notification is a trigger, not a required first step</text>
<path d="M 340 498 L 340 524" fill="none" stroke="#A08050" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fd)"/>
<path d="M 620 498 L 580 504 L 567 504 L 567 524" fill="none" stroke="#A08050" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fd)"/>
<line x1="50" y1="662" x2="1550" y2="662" stroke="#DCE5EE" stroke-width="1"/>
<text x="50" y="688" font-size="11.5" fill="#7C8DA0">Check-in by staff (staff step 3) automatically triggers the parent notification shown as the alternate entry point above.</text>
<text x="50" y="708" font-size="11.5" fill="#7C8DA0">Billing, infant monitoring and scheduling flows are out of MVP scope (see MVP Definition).</text>
</svg>